<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AAUP - مواد قسم علم الحاسوب</title>
    
    <link rel="icon" href="{{ url_for('static', filename='img/logo.png') }}" type="image/x-icon">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">

    <style>
        /* ===== CHATBOT STYLES ===== */
        #bot-launcher {
            position: fixed; bottom: 25px; left: 25px; width: 60px; height: 60px;
            background: linear-gradient(135deg, #1e88e5, #1565c0);
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            color: white; font-size: 26px; cursor: pointer; z-index: 9999;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3); transition: all 0.3s ease;
        }
        #bot-launcher:hover { transform: scale(1.1); }

        #bot-window {
            position: fixed; bottom: 95px; left: 25px; width: 350px; height: 500px;
            background: white; border-radius: 15px; display: none;
            flex-direction: column; overflow: hidden; z-index: 9999;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2); border: 1px solid #ddd;
            max-width: 90vw;
        }

        .bot-header {
            background: #1e88e5;
            color: white;
            padding: 15px;
            font-weight: bold;
        }

        .bot-header small {
            display: block;
            font-size: 12px;
            opacity: 0.8;
            margin-top: 3px;
        }
    </style>
</head>
<body>

<div id="app">
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('home') }}">
                <i class="fas fa-graduation-cap"></i>
                <span>AAUP - CS HUB</span>
            </a>
            <div class="nav-links">
                <a href="{{ url_for('about') }}" class="nav-link">
                    <i class="fas fa-link"></i> دليل الموقع 
                </a>
                <a href="{{ url_for('home') }}" class="nav-link active">
                    <i class="fas fa-book"></i> المواد
                </a>
            </div>
        </div>
    </nav>

    <!-- CONTENT -->
    <div class="container my-4">
        <h1>مواد قسم علم الحاسوب</h1>

        <!-- FILTERS -->
        <div class="row">
            <div class="col-md-4">
                <label>السنة</label>
                <select class="form-select">
                    <option>سنة أولى</option>
                    <option>سنة ثانية</option>
                    <option>سنة ثالثة</option>
                    <option>سنة رابعة</option>
                </select>
            </div>

            <div class="col-md-4">
                <label>الفصل</label>
                <select class="form-select">
                    <option>الفصل الأول</option>
                    <option>الفصل الثاني</option>
                </select>
            </div>

            <div class="col-md-4">
                <label>النوع</label>
                <select class="form-select">
                    <option>إجباري جامعة</option>
                    <option>إجباري كلية</option>
                    <option>إجباري تخصص</option>
                </select>
            </div>
        </div>
    </div>
</div>

<!-- BOT -->
<div id="bot-launcher" onclick="toggleBot()">
    <i class="fas fa-robot"></i>
</div>

<div id="bot-window">
    <div class="bot-header">
        <span><i class="fas fa-brain me-2"></i> مبتكر - مساعد الطلاب</span>
        <!-- ✅ الإضافة -->
        <small>Developed by Sajed Kittaneh</small>
    </div>

    <div id="bot-messages">
        <div class="msg-container bot">
            <div class="bubble">مرحباً! اسألني عن أي مادة.</div>
        </div>
    </div>

    <div class="bot-input-area">
        <input type="text" id="bot-input">
        <button onclick="sendToBot()">إرسال</button>
    </div>
</div>

<script>
function toggleBot() {
    const win = document.getElementById('bot-window');
    win.style.display = (win.style.display === 'flex') ? 'none' : 'flex';
}
</script>

</body>
</html>
