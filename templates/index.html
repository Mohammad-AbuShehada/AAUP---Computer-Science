<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AAUP - مواد قسم علم الحاسوب</title>
    
    <link rel="icon" href="{{ url_for('static', filename='img/logo.png') }}" type="image/x-icon">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">

    <style>
        #bot-launcher {
            position: fixed; bottom: 25px; left: 25px; width: 60px; height: 60px;
            background: linear-gradient(135deg, #1e88e5, #1565c0);
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            color: white; font-size: 26px; cursor: pointer; z-index: 9999;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3); transition: 0.3s;
        }
        #bot-launcher:hover { transform: scale(1.1); }

        #bot-window {
            position: fixed; bottom: 95px; left: 25px; width: 350px; height: 500px;
            background: white; border-radius: 15px; display: none;
            flex-direction: column; overflow: hidden; z-index: 9999;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }

        .bot-header {
            background: #1e88e5;
            color: white;
            padding: 15px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #bot-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            background: #f9f9f9;
        }

        .bubble {
            max-width: 85%;
            padding: 10px;
            border-radius: 15px;
            margin-bottom: 10px;
        }

        .msg-container.user { text-align: right; }
        .msg-container.user .bubble { background: #1e88e5; color: white; }

        .msg-container.bot .bubble { background: #e9e9e9; }

        .bot-input-area {
            display: flex;
            border-top: 1px solid #eee;
            padding: 8px;
        }

        .bot-input-area input {
            flex: 1;
            border: none;
            padding: 10px;
            outline: none;
        }

        .bot-input-area button {
            background: #1e88e5;
            border: none;
            color: white;
            padding: 5px 15px;
            border-radius: 8px;
        }

        .bot-link-btn {
            display: block;
            background: #1e88e5;
            color: white !important;
            padding: 8px;
            border-radius: 8px;
            text-decoration: none;
            margin-top: 5px;
            text-align: center;
        }
    </style>
</head>

<body>

<!-- زر البوت -->
<div id="bot-launcher" onclick="toggleBot()">
    <i class="fas fa-robot"></i>
</div>

<!-- نافذة البوت -->
<div id="bot-window">

    <!-- 🔥 الهيدر -->
    <div class="bot-header">
        <span>
            <i class="fas fa-brain me-2"></i>
            مبتكر - مساعد الطلاب <br>
            <small style="font-size: 12px; opacity: 0.9;">
                💻 تطوير: ساجد كتانه
            </small>
        </span>
        <span onclick="toggleBot()" style="cursor:pointer">
            <i class="fas fa-times"></i>
        </span>
    </div>

    <!-- 💬 الرسائل -->
    <div id="bot-messages">
        <div class="msg-container bot">
            <div class="bubble">
                👋 مرحباً!<br>
                أنا مساعدك الذكي للمواد 📚<br>
                اسألني عن أي مادة وسأعطيك روابطها<br><br>
                
            </div>
        </div>
    </div>

    <!-- ⌨️ الإدخال -->
    <div class="bot-input-area">
        <input type="text" id="bot-input" placeholder="اكتب رسالتك..."
               onkeypress="if(event.key==='Enter') sendToBot()">
        <button onclick="sendToBot()">
            <i class="fas fa-paper-plane"></i>
        </button>
    </div>

    <!-- 👇 توقيع -->
    <div style="text-align:center; font-size:12px; padding:6px; color:#888;">
        Developed by ساجد كتانه
    </div>

</div>

<script>
function toggleBot() {
    const win = document.getElementById('bot-window');
    win.style.display = (win.style.display === 'flex') ? 'none' : 'flex';
}

async function sendToBot() {
    const input = document.getElementById('bot-input');
    const text = input.value.trim();
    if(!text) return;

    const messages = document.getElementById('bot-messages');

    messages.innerHTML += `<div class="msg-container user"><div class="bubble">${text}</div></div>`;
    input.value = "";

    try {
        const res = await fetch("/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: text })
        });

        const data = await res.json();

        let reply = data.reply;

        if(reply.includes("http")) {
            reply = `<a href="${reply}" target="_blank" class="bot-link-btn">فتح الرابط</a>`;
        }

        messages.innerHTML += `<div class="msg-container bot"><div class="bubble">${reply}</div></div>`;
    } catch {
        messages.innerHTML += `<div class="msg-container bot"><div class="bubble">خطأ بالسيرفر</div></div>`;
    }

    messages.scrollTop = messages.scrollHeight;
}
</script>

</body>
</html>
